[project]
name = "kms-key-rotation-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
